name: App CI

on:
  pull_request:
    paths:
      - 'app/**'
      - '.github/workflows/app-ci.yml'
  push:
    branches:
      - main
    paths:
      - 'app/**'
      - '.github/workflows/app-ci.yml'

jobs:
  test-and-build:
    name: Test and Build App
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./app

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Fetch OpenAPI spec from production
        run: curl -o src/api/openapi.json https://api.systemdesigntrainer.com/api-docs-json

      - name: Generate API client code
        run: npm run codegen

      - name: Run linter
        run: npm run lint

      - name: Run tests
        run: npm run test -- --run

      - name: Build
        run: npm run build
